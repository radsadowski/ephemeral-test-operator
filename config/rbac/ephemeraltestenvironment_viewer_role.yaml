# This rule is not used by the project ephemeral-test-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to testing.cast.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephemeral-test-operator
    app.kubernetes.io/managed-by: kustomize
  name: ephemeraltestenvironment-viewer-role
rules:
- apiGroups:
  - testing.cast.ai
  resources:
  - ephemeraltestenvironments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - testing.cast.ai
  resources:
  - ephemeraltestenvironments/status
  verbs:
  - get
