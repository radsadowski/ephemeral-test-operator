# This rule is not used by the project ephemeral-test-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over testing.cast.ai.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephemeral-test-operator
    app.kubernetes.io/managed-by: kustomize
  name: ephemeraltestenvironment-admin-role
rules:
- apiGroups:
  - testing.cast.ai
  resources:
  - ephemeraltestenvironments
  verbs:
  - '*'
- apiGroups:
  - testing.cast.ai
  resources:
  - ephemeraltestenvironments/status
  verbs:
  - get
