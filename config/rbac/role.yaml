---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - testing.cast.ai
  resources:
  - ephemeraltestenvironments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - testing.cast.ai
  resources:
  - ephemeraltestenvironments/finalizers
  verbs:
  - update
- apiGroups:
  - testing.cast.ai
  resources:
  - ephemeraltestenvironments/status
  verbs:
  - get
  - patch
  - update
